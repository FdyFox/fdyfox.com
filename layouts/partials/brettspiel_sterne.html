{{- /* Sternewertung 0–5 (halbe Sterne erlaubt). Parameter: Zahl */ -}}
{{- $r := math.Min 5 (math.Max 0 (float .)) }}
<span class="bg-stars" role="img" aria-label="{{ lang.FormatNumber 1 $r }} von 5 Sternen" title="{{ lang.FormatNumber 1 $r }} von 5" style="{{ printf "--r: %v" $r | safeCSS }}">★★★★★</span>
