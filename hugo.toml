baseURL = "https://fdyfox.com/"
locale = "de-de"
language = "de-de"
defaultContentLanguage = "de-de"
title = "FdyFox"
enableRobotsTXT = true
enableGitInfo = true
paginate = 10
timeZone = "Europe/Berlin"

[outputs]
home = ["HTML", "RSS", "JSON", "slashpages", "blogroll"]

# /.well-known/slashpages (https://github.com/pfefferle/well-known-slashpages)
# Hugo schreibt slashpages.opml, .htaccess liefert es ohne Endung aus.
[mediaTypes."text/x-opml"]
suffixes = ["opml"]

[outputFormats.slashpages]
mediaType = "text/x-opml"
baseName = "slashpages"
path = ".well-known"
isPlainText = true
notAlternative = true

# /blogroll.opml – Blogroll aus data/blogroll.yaml für Feedreader
[outputFormats.blogroll]
mediaType = "text/x-opml"
baseName = "blogroll"
isPlainText = true
notAlternative = true

[params.footer]
text = "[/now](/now/) · [/uses](/uses/) · [/blogroll](/blogroll/) · [/kontakt](/kontakt/)\\\n[Impressum](/impressum/) · [Datenschutz](/datenschutz/)\\\n[←](https://uberblogr.de/prev/fdyfoxcom \"Vorheriger Blog im UberBlogr-Webring\") [UberBlogr Webring](https://uberblogr.de/home/fdyfoxcom) [→](https://uberblogr.de/next/fdyfoxcom \"Nächster Blog im UberBlogr-Webring\")"

[params]
commentsEndpoint = "/kommentare/api.php"
commentsLanguage = "de"
commentsPrivacyUrl = "/datenschutz/#kommentare"
author = "Ferdy"
description = "Notizen, Gedanken und Kram"
defaultTheme = "dark"
disableThemeToggle = true
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
ShowToc = false
mainSections = ["logbuch", "bastelstube"]

# Amazon-Partnerprogramm: Partner-ID für den amazon-Shortcode (z. B. "fdyfox-21")
[params.affiliate]
amazonTag = "fdyfox-21"

[params.cover]
hidden = false
hiddenInList = false
hiddenInSingle = false
linkFullImages = true

[params.homeInfoParams]
Title = ""
Content = '''<pre class="home-ascii">  __     _        __
 / _| __| |_   _ / _| _____  __
| |_ / _` | | | | |_ / _ \ \/ /
|  _| (_| | |_| |  _| (_) >  <
|_|  \__,_|\__, |_|  \___/_/\_\
           |___/</pre>

Notizen, Gedanken und Kram.

In der **[Bastelstube](/bastelstube/)** gibt es Anleitungen, Lösungen und Basteleien rund um Technik.
Persönliches, also Gedanken und was mich sonst so beschäftigt, steht im **[Logbuch](/logbuch/)**.'''

