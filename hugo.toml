baseURL = "https://fdyfox.com/"
locale = "de-de"
language = "de-de"
defaultContentLanguage = "de-de"
title = "FdyFox"
theme = "PaperMod"
enableRobotsTXT = true
enableGitInfo = true
paginate = 10

[outputs]
  home = ["HTML", "RSS", "JSON", "slashpages"]

# /.well-known/slashpages (https://github.com/pfefferle/well-known-slashpages)
# Hugo schreibt slashpages.opml, .htaccess liefert es ohne Endung aus.
[mediaTypes."text/x-opml"]
  suffixes = ["opml"]

[outputFormats.slashpages]
  mediaType = "text/x-opml"
  baseName = "slashpages"
  path = ".well-known"
  isPlainText = true
  notAlternative = true

[params.footer]
  text = "[Impressum](/impressum/) · [Datenschutz](/datenschutz/)\\\n[←](https://uberblogr.de/prev/fdyfoxcom \"Vorheriger Blog im UberBlogr-Webring\") [UberBlogr Webring](https://uberblogr.de/home/fdyfoxcom) [→](https://uberblogr.de/next/fdyfoxcom \"Nächster Blog im UberBlogr-Webring\")"

[params]
  author = "Ferdy"
  description = "Notizen, Gedanken und Kram"
  defaultTheme = "dark"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = false
  mainSections = ["posts"]

[params.cover]
  hidden = false
  hiddenInList = false
  hiddenInSingle = false
  linkFullImages = true

[params.homeInfoParams]
  Title = ""
  Content = '''<pre class="home-ascii">  __     _        __
 / _| __| |_   _ / _| _____  __
| |_ / _` | | | | |_ / _ \ \/ /
|  _| (_| | |_| |  _| (_) >  <
|_|  \__,_|\__, |_|  \___/_/\_\
           |___/</pre>

Notizen, Gedanken und Kram.'''

# Slash-Pages für /.well-known/slashpages; category nach slashpages.net
[[params.slashpages]]
  page = "/about"
  category = "/about"

[[params.slashpages]]
  page = "/kontakt"
  category = "/contact"

[[params.slashpages]]
  page = "/posts"
  category = "/blog"
  text = "Logbuch"

[[params.slashpages]]
  page = "/wiki"
  category = "/wiki"

[[params.slashpages]]
  page = "/search"
  category = "/search"

[[params.slashpages]]
  page = "/impressum"
  category = "/imprint"

[[params.slashpages]]
  page = "/datenschutz"
  category = "/privacy"

[[params.socialIcons]]
  name = "email"
  url = "mailto:ferdy@fdyfox.com"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/FdyFox"

[[params.socialIcons]]
  name = "telegram"
  url = "https://t.me/brazier85"

[[params.socialIcons]]
  name = "signal"
  url = "https://signal.me/#eu/E5WqkEwvgEPOcT0rofLpNThsJ72WBqw7qnQ-G7aqz9slVXpsQFhJSpUWiv0q6pVK"

[menu]
  [[menu.main]]
    name = "~/Logbuch"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "~/Wiki"
    url = "/wiki/"
    weight = 2
  [[menu.main]]
    name = "~/Tags"
    url = "/tags/"
    weight = 3
  [[menu.main]]
    name = "~/Suche"
    url = "/search/"
    weight = 4
  [[menu.main]]
    name = "~/About"
    url = "/about/"
    weight = 5
  [[menu.main]]
    name = "~/Kontakt"
