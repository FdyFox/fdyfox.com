baseURL = "https://fdyfox.com/"
languageCode = "de-de"
language = "de-de"
defaultContentLanguage = "de-de"
title = "FdyFox"
theme = "PaperMod"
enableRobotsTXT = true
paginate = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params.footer]
  text = "[Impressum](/impressum/) · [Datenschutz](/datenschutz/)"

[params]
  author = "Ferdy"
  description = "Notizen, Gedanken und Kram"
  defaultTheme = "dark"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = false

[params.cover]
  hidden = false
  hiddenInList = false
  hiddenInSingle = false
  linkFullImages = true

[params.homeInfoParams]
  Title = ""
  Content = '''<pre class="home-ascii">  __     _        __
 / _| __| |_   _ / _| _____  __
| |_ / _` | | | | |_ / _ \ \/ /
|  _| (_| | |_| |  _| (_) >  <
|_|  \__,_|\__, |_|  \___/_/\_\
           |___/</pre>

Notizen, Gedanken und Kram.'''

