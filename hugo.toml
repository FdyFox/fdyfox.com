[menu]
  [[menu.main]]
    name = "~/Logbuch"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "~/Tags"
    url = "/tags/"
    weight = 2
  [[menu.main]]
    name = "~/Suche"
    url = "/search/"
    weight = 3
  [[menu.main]]
    name = "~/About"
    url = "/about/"
    weight = 4
  [[menu.main]]
    name = "~/Kontakt"
    url = "/kontakt/"
