name = "~/?"
title = "Suche"
url = "/search/"
weight = 5

[taxonomies]
tag = "tags"
category = "categories"

# Originale aus Page Bundles nicht veröffentlichen, nur die von render-image.html erzeugten Bilder (ohne Exif-Daten)
[[cascade]]
  [cascade.build]
    publishResources = false

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.extras.alerts]
enable = true

[markup.highlight]
noClasses = false

# Kommentare (Submodul): bleiben unter /kommentare/, damit Datenbank, Admin-URL und Mail-Links gleich bleiben
[module]
  [[module.imports]]
    path = "hugo-php-comments"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
    [[module.imports.mounts]]
      source = "assets"
      target = "assets"
    [[module.imports.mounts]]
      source = "data"
      target = "data"
    [[module.imports.mounts]]
      source = "static/comments"
      target = "static/kommentare"
  [[module.imports]]
    path = "PaperMod"
