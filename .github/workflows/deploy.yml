name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0  # vollständige Historie für Git-Lastmod im Wiki

      - name: Setup Hugo
        uses: jdx/mise-action@v5  # Version aus mise.toml

      - name: Build
        run: hugo --minify

      # Bei Pull Requests (z.B. Renovate-Updates) nur testweise bauen
      - name: Deploy via FTP
        if: github.event_name == 'push'
        run: |
          sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes;
            open ftp://${{ secrets.FTP_USER }}:${{ secrets.FTP_PASS }}@${{ secrets.FTP_HOST }};
            mirror --reverse --delete --parallel=8 public/ ${{ secrets.FTP_PATH }}
          "
