name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0  # vollständige Historie für Git-Lastmod im Wiki

      - name: Setup Hugo
        uses: jdx/mise-action@v5  # Version aus mise.toml

      # data/changelog.json aus den "Changelog:"-Zeilen der Commits (nicht eingecheckt)
      - name: Collect changelog
        run: python3 scripts/changelog-sync.py

      - name: Build
        run: hugo --minify

      # Hash des Admin-Passworts für static/kommentare/admin.php (Kommentar-Verwaltung).
      - name: Write comment config
        if: github.event_name == 'push'
        env:
          COMMENT_ADMIN_PASSWORD: ${{ secrets.COMMENT_ADMIN_PASSWORD }}
        run: |
          if [ -n "$COMMENT_ADMIN_PASSWORD" ]; then
            scripts/kommentare-config.sh public/kommentare/config.php
          else
            echo "::warning::COMMENT_ADMIN_PASSWORD fehlt, die Kommentar-Verwaltung ist deaktiviert"
          fi

      # server-dir muss mit / enden, egal wie FTP_PATH hinterlegt ist
      - name: Prepare FTP path
        if: github.event_name == 'push'
        id: ftp
        env:
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: echo "dir=${FTP_PATH%/}/" >> "$GITHUB_OUTPUT"

      # Lädt nur Dateien hoch, deren Inhalt sich geändert hat, und löscht nur, was
      # weggefallen ist. Grundlage ist eine Liste mit Prüfsummen auf dem Server
      # (.ftp-deploy-sync-state.json). Dateien, die nie über die Action hochgeladen
      # wurden (z.B. kommentare/daten/), fasst sie nicht an.
      # Bei Pull Requests (z.B. Renovate-Updates) nur testweise bauen
      - name: Deploy via FTP
        if: github.event_name == 'push'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          security: strict
          local-dir: ./public/
          server-dir: ${{ steps.ftp.outputs.dir }}
          exclude: |
            kommentare/daten/**
